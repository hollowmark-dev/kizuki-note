<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>気づきノート</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#34405C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="気づきノート">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --surface-2:#F6F7F2;
  --ink:#262922; --ink-soft:#63685C; --ink-faint:#9A9D8F;
  --border:rgba(38,41,34,0.13); --border-strong:rgba(38,41,34,0.24);
  --accent:#34405C; --accent-soft:#E3E7EF; --accent-ink:#1D2740;
  --danger:#A23B2E; --danger-bg:#F3E2DE;
  --g-work-bg:#F1E3DA; --g-work-fg:#7A4A31;
  --g-health-bg:#E4EAE0; --g-health-fg:#3E5A41;
  --g-money-bg:#F1E9D2; --g-money-fg:#7A5F1E;
  --g-relationships-bg:#F2E1E6; --g-relationships-fg:#7A3E52;
  --g-growth-bg:#E7E3F0; --g-growth-fg:#4C3E73;
  --g-other-bg:#EAE7E0; --g-other-fg:#5A5348;
  --font-display:'Shippori Mincho', serif;
  --font-body:'Zen Kaku Gothic New', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1D18; --surface:#242620; --surface-2:#2B2D25;
    --ink:#ECEAE1; --ink-soft:#ABAC9C; --ink-faint:#767869;
    --border:rgba(236,234,225,0.14); --border-strong:rgba(236,234,225,0.26);
    --accent:#92A6D9; --accent-soft:#2B3550; --accent-ink:#D3DCF3;
    --danger:#E28376; --danger-bg:#3B2620;
    --g-work-bg:#3B2A1F; --g-work-fg:#E3A585;
    --g-health-bg:#25332A; --g-health-fg:#A9C9AC;
    --g-money-bg:#372F1B; --g-money-fg:#E0C177;
    --g-relationships-bg:#372430; --g-relationships-fg:#E3A8BC;
    --g-growth-bg:#2B2640; --g-growth-fg:#C1B3E6;
    --g-other-bg:#302E26; --g-other-fg:#C6C1B4;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1D18; --surface:#242620; --surface-2:#2B2D25;
  --ink:#ECEAE1; --ink-soft:#ABAC9C; --ink-faint:#767869;
  --border:rgba(236,234,225,0.14); --border-strong:rgba(236,234,225,0.26);
  --accent:#92A6D9; --accent-soft:#2B3550; --accent-ink:#D3DCF3;
  --danger:#E28376; --danger-bg:#3B2620;
  --g-work-bg:#3B2A1F; --g-work-fg:#E3A585;
  --g-health-bg:#25332A; --g-health-fg:#A9C9AC;
  --g-money-bg:#372F1B; --g-money-fg:#E0C177;
  --g-relationships-bg:#372430; --g-relationships-fg:#E3A8BC;
  --g-growth-bg:#2B2640; --g-growth-fg:#C1B3E6;
  --g-other-bg:#302E26; --g-other-fg:#C6C1B4;
}
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); }
#app{ max-width:480px; margin:0 auto; padding:0 16px 48px; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.header{ padding:24px 0 12px; }
.header h1{ font-family:var(--font-display); font-weight:600; font-size:22px; margin:0 0 2px; text-wrap:balance; }
.header p{ margin:0; color:var(--ink-soft); font-size:13px; }
.tabs{ position:sticky; top:0; background:var(--bg); padding:8px 0 12px; display:flex; gap:8px; z-index:5; }
.tab-btn{ flex:1; padding:10px 12px; border-radius:10px; border:0.5px solid var(--border); background:var(--surface); color:var(--ink-soft); font-family:var(--font-body); font-size:14px; font-weight:500; cursor:pointer; }
.tab-btn.is-active{ background:var(--accent); color:#fff; border-color:var(--accent); }
.card{ background:var(--surface); border:0.5px solid var(--border); border-radius:12px; padding:16px; }
label{ display:block; font-size:12px; color:var(--ink-soft); margin:0 0 6px; }
input[type=text], textarea{ width:100%; font-family:var(--font-body); font-size:15px; color:var(--ink); background:var(--surface-2); border:0.5px solid var(--border); border-radius:8px; padding:10px 12px; }
input[type=text]:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
textarea{ resize:vertical; min-height:84px; line-height:1.6; }
.field{ margin-bottom:14px; }
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ padding:7px 14px; border-radius:999px; border:0.5px solid var(--border-strong); background:var(--surface-2); color:var(--ink-soft); font-family:var(--font-body); font-size:13px; cursor:pointer; }
.chip.is-selected{ background:var(--accent); border-color:var(--accent); color:#fff; }
.chip.genre-work.is-selected{ background:var(--g-work-fg); border-color:var(--g-work-fg); }
.chip.genre-health.is-selected{ background:var(--g-health-fg); border-color:var(--g-health-fg); }
.chip.genre-money.is-selected{ background:var(--g-money-fg); border-color:var(--g-money-fg); }
.chip.genre-relationships.is-selected{ background:var(--g-relationships-fg); border-color:var(--g-relationships-fg); }
.chip.genre-growth.is-selected{ background:var(--g-growth-fg); border-color:var(--g-growth-fg); }
.chip.genre-other.is-selected{ background:var(--g-other-fg); border-color:var(--g-other-fg); }
.btn-primary{ width:100%; padding:12px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-family:var(--font-body); font-size:15px; font-weight:500; cursor:pointer; margin-top:4px; }
.btn-primary:active{ transform:scale(0.99); }
.btn-primary:disabled{ opacity:0.6; cursor:default; }
.error-text{ color:var(--danger); font-size:13px; margin-top:8px; min-height:16px; }
.pending-note{ font-size:13px; color:var(--ink-soft); margin-top:16px; text-align:center; }
.pending-note button{ background:none; border:none; color:var(--accent); text-decoration:underline; font-family:var(--font-body); font-size:13px; cursor:pointer; padding:0; }
.filter-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.filter-chip{ padding:6px 12px; border-radius:999px; border:0.5px solid var(--border-strong); background:var(--surface); color:var(--ink-soft); font-size:12px; cursor:pointer; }
.filter-chip.is-active{ background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent); }
.entry-list{ display:flex; flex-direction:column; gap:10px; }
.entry-card{ background:var(--surface); border:0.5px solid var(--border); border-radius:12px; overflow:hidden; }
.entry-head{ position:relative; overflow:hidden; padding:14px 16px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; cursor:pointer; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
.entry-head::before{ content:''; position:absolute; inset:0; background:var(--danger-bg); width:0%; z-index:0; pointer-events:none; }
.entry-head.is-holding::before{ width:100%; transition:width 800ms linear; }
.entry-head > *{ position:relative; z-index:1; }
.entry-titlewrap{ min-width:0; }
.entry-title{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 6px; text-wrap:balance; }
.entry-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.genre-badge{ font-size:11px; padding:3px 9px; border-radius:999px; white-space:nowrap; }
.genre-badge.genre-work{ background:var(--g-work-bg); color:var(--g-work-fg); }
.genre-badge.genre-health{ background:var(--g-health-bg); color:var(--g-health-fg); }
.genre-badge.genre-money{ background:var(--g-money-bg); color:var(--g-money-fg); }
.genre-badge.genre-relationships{ background:var(--g-relationships-bg); color:var(--g-relationships-fg); }
.genre-badge.genre-growth{ background:var(--g-growth-bg); color:var(--g-growth-fg); }
.genre-badge.genre-other{ background:var(--g-other-bg); color:var(--g-other-fg); }
.date-text{ font-size:11px; color:var(--ink-faint); }
.memo-badge{ font-size:11px; color:var(--danger); background:var(--danger-bg); padding:3px 9px; border-radius:999px; }
.count-badge{ font-size:11px; color:var(--accent-ink); background:var(--accent-soft); padding:3px 9px; border-radius:999px; }
.chevron{ color:var(--ink-faint); font-size:18px; flex-shrink:0; transition:transform 0.15s; }
.entry-card.is-open .chevron{ transform:rotate(180deg); }
.entry-body{ padding:0 16px 16px; border-top:0.5px solid var(--border); padding-top:14px; }
.row-actions{ display:flex; gap:10px; margin-top:12px; }
.btn-save{ width:100%; padding:10px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-family:var(--font-body); font-size:14px; font-weight:500; cursor:pointer; }
.empty-state{ text-align:center; padding:48px 16px; color:var(--ink-soft); }
.empty-state p{ margin:6px 0 0; font-size:14px; }
.empty-state strong{ font-family:var(--font-display); font-size:17px; color:var(--ink); font-weight:600; }
.btn-copy{ width:100%; padding:10px; border-radius:8px; border:0.5px solid var(--border-strong); background:var(--surface-2); color:var(--ink); font-family:var(--font-body); font-size:13px; cursor:pointer; }
.btn-toggle-details{ display:block; background:none; border:none; padding:0; margin:0 0 14px; font-family:var(--font-body); font-size:13px; color:var(--ink-soft); cursor:pointer; text-align:left; }
.copy-status{ font-size:12px; color:var(--ink-soft); margin:6px 0 0; min-height:14px; }
.copy-fallback{ width:100%; margin-top:8px; font-family:var(--font-body); font-size:12px; color:var(--ink); background:var(--surface-2); border:0.5px solid var(--border); border-radius:8px; padding:8px; min-height:60px; }
.review-section{ margin-bottom:28px; }
.review-heading{ margin:0 0 12px; }
.review-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
.review-phrase{ display:flex; align-items:baseline; gap:6px; width:100%; text-align:left; background:none; border:none; padding:0; font-family:var(--font-display); font-size:15px; color:var(--ink); cursor:pointer; line-height:1.6; }
.review-phrase .chev{ color:var(--ink-faint); font-size:12px; flex-shrink:0; }
.review-source{ display:block; font-size:12px; color:var(--ink-faint); margin-top:3px; }
.review-detail{ font-size:13px; color:var(--ink-soft); line-height:1.7; margin:6px 0 0; }
.pick-card{ background:var(--accent-soft); border-radius:12px; padding:16px; margin-bottom:24px; }
.pick-label{ font-size:12px; color:var(--accent-ink); font-weight:500; margin:0 0 8px; }
.pick-phrase{ display:flex; align-items:baseline; gap:6px; width:100%; text-align:left; background:none; border:none; padding:0; font-family:var(--font-display); font-size:17px; color:var(--accent-ink); cursor:pointer; line-height:1.6; margin:0 0 8px; text-wrap:balance; }
.pick-phrase .chev{ font-size:13px; flex-shrink:0; opacity:0.7; }
.pick-detail{ font-size:13px; color:var(--accent-ink); opacity:0.85; line-height:1.7; margin:0 0 12px; }
.pick-source{ font-size:12px; color:var(--accent-ink); opacity:0.75; margin:0 0 12px; }
.points-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
.point-row{ background:var(--surface-2); border:0.5px solid var(--border); border-radius:8px; padding:10px; }
.point-row-head{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.point-phrase{ flex:1; }
.point-remove{ width:28px; height:28px; flex-shrink:0; border-radius:50%; border:0.5px solid var(--border-strong); background:var(--surface); color:var(--ink-soft); font-size:15px; line-height:1; cursor:pointer; }
.point-detail{ min-height:56px; font-size:13px; }
.btn-add-point{ width:100%; padding:10px; border-radius:8px; border:1px dashed var(--border-strong); background:transparent; color:var(--ink-soft); font-family:var(--font-body); font-size:13px; cursor:pointer; }
.btn-shuffle{ padding:8px 14px; border-radius:8px; border:0.5px solid var(--border-strong); background:var(--surface); color:var(--ink); font-family:var(--font-body); font-size:13px; cursor:pointer; }
.link-open{ display:inline-block; margin-top:6px; font-size:12px; color:var(--accent); }
.settings-desc{ font-size:13px; color:var(--ink-soft); margin:0 0 12px; line-height:1.6; }
input[type=file]{ width:100%; font-family:var(--font-body); font-size:13px; color:var(--ink); }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var STORAGE_KEY = 'kizuki-note-entries';
  var SEED_ENTRIES = [
    { id: 'mtcrycu685fz9', title: '限りある時間の使い方', genre: 'growth', author: '', source: '', url: '', points: [], date: '2026-08-28' },
    { id: 'mt9cwj348yav4', title: '大事なことだけ聞く力', genre: 'growth', author: '', source: '', url: '', points: [], date: '2026-08-26' },
    { id: 'mt8mvmljcw0cr', title: '7つの習慣', genre: 'growth', author: '', source: '', url: '', points: [], date: '2026-08-25' }
  ];

  var GENRES = [
    { id: 'work', label: '仕事' },
    { id: 'health', label: '健康' },
    { id: 'money', label: 'お金' },
    { id: 'relationships', label: '人間関係' },
    { id: 'growth', label: '自己啓発' },
    { id: 'other', label: 'その他' }
  ];

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function migrateEntry(e) {
    if (Array.isArray(e.points)) return e;
    var points = bulletsOf(e.memo).map(function (text) {
      return { id: genId(), phrase: text, detail: '' };
    });
    var migrated = {};
    for (var k in e) { if (k !== 'memo') migrated[k] = e[k]; }
    migrated.points = points;
    return migrated;
  }

  function loadEntries() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw).map(migrateEntry);
    } catch (e) {}
    return SEED_ENTRIES;
  }

  function saveEntries(entries) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch (e) {}
  }

  var state = { entries: loadEntries() };
  var activeTab = 'add';
  var filterGenre = 'all';
  var expandedId = null;
  var drafts = {};
  var searchQuery = '';
  var pickOffset = 0;
  var revealedPoints = {};
  var detailsExpanded = {};
  var pickRevealed = false;
  var holdTimer = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function todayStr() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function genreOf(id) {
    for (var i = 0; i < GENRES.length; i++) if (GENRES[i].id === id) return GENRES[i];
    return GENRES[GENRES.length - 1];
  }

  function bulletsOf(memo) {
    return (memo || '').split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
  }

  function matchesSearch(entry, q) {
    if (!q) return true;
    var pointText = (entry.points || []).map(function (p) { return p.phrase + ' ' + p.detail; }).join(' ');
    var hay = (entry.title + ' ' + (entry.author || '') + ' ' + pointText).toLowerCase();
    return hay.indexOf(q.toLowerCase()) !== -1;
  }

  function allPointsFlat() {
    var out = [];
    state.entries.forEach(function (e) {
      (e.points || []).forEach(function (p) {
        out.push({ id: p.id, phrase: p.phrase, detail: p.detail, title: e.title, genre: e.genre });
      });
    });
    return out;
  }

  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }

  function exportBackup() {
    var data = JSON.stringify(state.entries, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'kizuki-note-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function handleImportFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = JSON.parse(reader.result); } catch (e) {
        var errEl = document.getElementById('import-status');
        if (errEl) errEl.textContent = 'ファイルの形式が正しくありません';
        return;
      }
      if (!Array.isArray(parsed)) {
        var errEl2 = document.getElementById('import-status');
        if (errEl2) errEl2.textContent = 'ファイルの形式が正しくありません';
        return;
      }
      var existingIds = {};
      state.entries.forEach(function (e) { existingIds[e.id] = true; });
      var newEntries = state.entries.slice();
      var added = 0;
      parsed.forEach(function (item) {
        if (!item || typeof item.title !== 'string' || !item.title.trim()) return;
        var id = (typeof item.id === 'string' && item.id) ? item.id : genId();
        if (existingIds[id]) return;
        existingIds[id] = true;
        var points;
        if (Array.isArray(item.points)) {
          points = item.points.filter(function (p) { return p && typeof p.phrase === 'string'; }).map(function (p) {
            return { id: (typeof p.id === 'string' && p.id) ? p.id : genId(), phrase: p.phrase, detail: typeof p.detail === 'string' ? p.detail : '' };
          });
        } else if (typeof item.memo === 'string') {
          points = bulletsOf(item.memo).map(function (text) { return { id: genId(), phrase: text, detail: '' }; });
        } else {
          points = [];
        }
        newEntries.push({
          id: id,
          title: item.title,
          genre: GENRES.some(function (g) { return g.id === item.genre; }) ? item.genre : 'other',
          author: typeof item.author === 'string' ? item.author : '',
          source: typeof item.source === 'string' ? item.source : '',
          url: typeof item.url === 'string' ? item.url : '',
          points: points,
          date: typeof item.date === 'string' ? item.date : todayStr()
        });
        added++;
      });
      var skipped = parsed.length - added;
      persist(newEntries);
      var statusEl = document.getElementById('import-status');
      if (statusEl) statusEl.textContent = added + '件の記録を追加しました（' + skipped + '件は既存のためスキップ）';
    };
    reader.readAsText(file);
  }

  function persist(newEntries) {
    state = { entries: newEntries };
    saveEntries(newEntries);
    render();
  }

  async function copyResearchPrompt(id) {
    var entry = state.entries.find(function (e) { return e.id === id; });
    if (!entry) return;
    var d = drafts[id] || {};
    var title = (d.title !== undefined ? d.title : entry.title).trim();
    var author = (d.author !== undefined ? d.author : entry.author || '').trim();
    var subject = author ? '「' + title + '」（著者: ' + author + '）' : '「' + title + '」';
    var prompt = subject + 'について、学べる重要なポイントを5つくらい、次の形式で書き出して。\n\n' +
      'キーフレーズ: 「〜する」「〜しない」のように動詞で言い切る形にする。体言止めや抽象的な名詞句（例:「〜の技術」「〜という考え方」）は禁止。あとで見返した時に一目で意味が分かる具体的な行動・主張にする\n' +
      '解説: 2〜3文の具体的な説明\n\n' +
      'これを繰り返す形式で、他の説明文は不要。文体は「〜だ」「〜である」調の言い切りで統一し、です・ます調の敬語は使わないこと。';
    var statusEl = document.getElementById('copy-status-' + id);
    var fallbackEl = document.getElementById('copy-fallback-' + id);
    try {
      if (!navigator.clipboard) throw new Error('no clipboard api');
      await navigator.clipboard.writeText(prompt);
      if (statusEl) statusEl.textContent = 'コピーしました。AIアプリに貼り付けてね';
      if (fallbackEl) fallbackEl.style.display = 'none';
    } catch (e) {
      if (statusEl) statusEl.textContent = '自動コピーできませんでした。下の文章を選択してコピーしてください';
      if (fallbackEl) {
        fallbackEl.style.display = 'block';
        fallbackEl.value = prompt;
        fallbackEl.focus();
        fallbackEl.select();
      }
    }
  }

  function setTab(t) { activeTab = t; expandedId = null; render(); }
  function setFilter(g) { filterGenre = g; render(); }

  function toggleExpand(id) {
    var entry = state.entries.find(function (e) { return e.id === id; });
    if (!entry) return;
    if (expandedId === id) { expandedId = null; render(); return; }
    if (!drafts[id]) {
      drafts[id] = {
        title: entry.title, author: entry.author || '', source: entry.source || '', url: entry.url || '', genre: entry.genre,
        points: (entry.points || []).map(function (p) { return { id: p.id, phrase: p.phrase, detail: p.detail }; })
      };
      if (detailsExpanded[id] === undefined) {
        detailsExpanded[id] = !!(entry.author || entry.source || entry.url);
      }
    }
    expandedId = id;
    render();
  }

  function handleAdd() {
    var input = document.getElementById('add-title');
    var errEl = document.getElementById('add-error');
    var title = input.value.trim();
    var selected = document.querySelector('#add-genres .chip.is-selected');
    if (!title) { errEl.textContent = 'タイトルを入力してください'; return; }
    if (!selected) { errEl.textContent = 'ジャンルを選んでください'; return; }
    errEl.textContent = '';
    var entry = {
      id: genId(),
      title: title, genre: selected.dataset.genre, author: '', source: '', url: '', points: [], date: todayStr()
    };
    persist([entry].concat(state.entries));
  }

  function handleSaveEntry(id) {
    var d = drafts[id] || {};
    var title = (d.title || '').trim();
    if (!title) {
      document.getElementById('edit-error-' + id).textContent = 'タイトルを入力してください';
      return;
    }
    var points = (d.points || [])
      .map(function (p) { return { id: p.id, phrase: (p.phrase || '').trim(), detail: (p.detail || '').trim() }; })
      .filter(function (p) { return p.phrase; });
    var newEntries = state.entries.map(function (e) {
      if (e.id !== id) return e;
      return { id: e.id, date: e.date, title: title, genre: d.genre || e.genre, author: (d.author || '').trim(), source: (d.source || '').trim(), url: (d.url || '').trim(), points: points };
    });
    persist(newEntries);
  }

  function handleDelete(id, skipConfirm) {
    if (!skipConfirm && !confirm('この記録を削除しますか？')) return;
    persist(state.entries.filter(function (e) { return e.id !== id; }));
  }

  function renderAddTab() {
    var pending = state.entries.filter(function (e) { return !(e.points && e.points.length); }).length;
    var chips = GENRES.map(function (g) {
      return '<button type="button" class="chip genre-' + g.id + '" data-action="add-genre" data-genre="' + g.id + '">' + esc(g.label) + '</button>';
    }).join('');
    var pendingHtml = pending > 0
      ? '<p class="pending-note">メモ未記入が ' + pending + ' 件あります　<button type="button" data-action="tab" data-tab="browse">本棚で書く</button></p>'
      : '';
    return (
      '<div class="card">' +
        '<div class="field">' +
          '<label for="add-title">聴いた本・動画のタイトル</label>' +
          '<input type="text" id="add-title" placeholder="例: 7つの習慣">' +
        '</div>' +
        '<div class="field">' +
          '<label>ジャンル</label>' +
          '<div class="chip-row" id="add-genres">' + chips + '</div>' +
        '</div>' +
        '<button type="button" class="btn-primary" data-action="submit-add">追加する</button>' +
        '<p class="error-text" id="add-error" aria-live="polite"></p>' +
      '</div>' +
      pendingHtml
    );
  }

  function renderEntryCard(entry) {
    var isOpen = expandedId === entry.id;
    var g = genreOf(entry.genre);
    var pointCount = (entry.points || []).length;
    var badges = '<span class="genre-badge genre-' + g.id + '">' + esc(g.label) + '</span>' +
      '<span class="date-text">' + esc(entry.date) + '</span>' +
      (pointCount > 0 ? '<span class="count-badge">気づき ' + pointCount + '件</span>' : '<span class="memo-badge">メモ未記入</span>');
    var body = '';
    if (isOpen) {
      var d = drafts[entry.id] || {
        title: entry.title, author: entry.author || '', source: entry.source || '', url: entry.url || '', genre: entry.genre,
        points: (entry.points || []).map(function (p) { return { id: p.id, phrase: p.phrase, detail: p.detail }; })
      };
      var editChips = GENRES.map(function (gg) {
        var sel = d.genre === gg.id ? ' is-selected' : '';
        return '<button type="button" class="chip genre-' + gg.id + sel + '" data-action="edit-genre" data-id="' + entry.id + '" data-genre="' + gg.id + '">' + esc(gg.label) + '</button>';
      }).join('');
      body =
        '<div class="entry-body">' +
          '<button type="button" class="btn-toggle-details" data-action="toggle-details" data-id="' + entry.id + '">' +
            (detailsExpanded[entry.id] ? '︿ タイトル・ジャンルなどを隠す' : '﹀ タイトル・ジャンル・著者などを編集') +
          '</button>' +
          (detailsExpanded[entry.id] ? (
            '<div class="field">' +
              '<label for="et-' + entry.id + '">タイトル</label>' +
              '<input type="text" id="et-' + entry.id + '" data-field="title" data-id="' + entry.id + '" value="' + esc(d.title) + '">' +
            '</div>' +
            '<div class="field">' +
              '<label>ジャンル</label>' +
              '<div class="chip-row">' + editChips + '</div>' +
            '</div>' +
            '<div class="field">' +
              '<label for="ea-' + entry.id + '">著者</label>' +
              '<input type="text" id="ea-' + entry.id + '" data-field="author" data-id="' + entry.id + '" value="' + esc(d.author) + '">' +
            '</div>' +
            '<div class="field">' +
              '<label for="es-' + entry.id + '">情報源</label>' +
              '<input type="text" id="es-' + entry.id + '" data-field="source" data-id="' + entry.id + '" placeholder="YouTube / フライヤー / 本 など" value="' + esc(d.source) + '">' +
            '</div>' +
            '<div class="field">' +
              '<label for="eu-' + entry.id + '">URL</label>' +
              '<input type="text" id="eu-' + entry.id + '" data-field="url" data-id="' + entry.id + '" placeholder="https://..." value="' + esc(d.url) + '">' +
              (d.url ? '<a class="link-open" href="' + esc(d.url) + '" target="_blank" rel="noopener">元の動画・ページを開く ▸</a>' : '') +
            '</div>'
          ) : '') +
          '<div class="field">' +
            '<button type="button" class="btn-copy" data-action="copy-research" data-id="' + entry.id + '">AI調査用にコピー</button>' +
            '<p class="copy-status" id="copy-status-' + entry.id + '" aria-live="polite"></p>' +
            '<textarea class="copy-fallback" id="copy-fallback-' + entry.id + '" readonly style="display:none;"></textarea>' +
          '</div>' +
          '<div class="field">' +
            '<label>学び・気づき</label>' +
            '<div class="points-list">' +
              (d.points || []).map(function (p) {
                return '<div class="point-row">' +
                  '<div class="point-row-head">' +
                    '<input type="text" class="point-phrase" data-field="phrase" data-id="' + entry.id + '" data-point-id="' + p.id + '" placeholder="キーフレーズ" value="' + esc(p.phrase) + '">' +
                    '<button type="button" class="point-remove" data-action="remove-point" data-id="' + entry.id + '" data-point-id="' + p.id + '" aria-label="このポイントを削除">×</button>' +
                  '</div>' +
                  '<textarea class="point-detail" data-field="detail" data-id="' + entry.id + '" data-point-id="' + p.id + '" placeholder="解説・具体的な内容（あとで読み返す用）">' + esc(p.detail) + '</textarea>' +
                '</div>';
              }).join('') +
            '</div>' +
            '<button type="button" class="btn-add-point" data-action="add-point" data-id="' + entry.id + '">+ ポイントを追加</button>' +
          '</div>' +
          '<p class="error-text" id="edit-error-' + entry.id + '" aria-live="polite"></p>' +
          '<div class="row-actions">' +
            '<button type="button" class="btn-save" data-action="save" data-id="' + entry.id + '">保存する</button>' +
          '</div>' +
        '</div>';
    }
    return (
      '<div class="entry-card' + (isOpen ? ' is-open' : '') + '" data-entry-id="' + entry.id + '">' +
        '<div class="entry-head" data-action="toggle" data-id="' + entry.id + '">' +
          '<div class="entry-titlewrap">' +
            '<p class="entry-title">' + esc(entry.title) + '</p>' +
            '<div class="entry-meta">' + badges + '</div>' +
          '</div>' +
          '<span class="chevron" aria-hidden="true">⌄</span>' +
        '</div>' +
        body +
      '</div>'
    );
  }

  function renderBrowseTab() {
    var filterChips = ['<button type="button" class="filter-chip' + (filterGenre === 'all' ? ' is-active' : '') + '" data-action="filter" data-genre="all">全て</button>']
      .concat(GENRES.map(function (g) {
        return '<button type="button" class="filter-chip' + (filterGenre === g.id ? ' is-active' : '') + '" data-action="filter" data-genre="' + g.id + '">' + esc(g.label) + '</button>';
      })).join('');
    var list = state.entries
      .filter(function (e) { return filterGenre === 'all' || e.genre === filterGenre; })
      .filter(function (e) { return matchesSearch(e, searchQuery); })
      .slice()
      .sort(function (a, b) { return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); });
    var listHtml;
    if (list.length === 0) {
      listHtml = state.entries.length === 0
        ? '<div class="empty-state"><strong>まだ記録がありません</strong><p>「追加」タブからタイトルを記録してみましょう。</p></div>'
        : '<div class="empty-state"><p>' + (searchQuery ? '検索に一致する記録がありません。' : 'このジャンルの記録はまだありません。') + '</p></div>';
    } else {
      listHtml = '<div class="entry-list">' + list.map(renderEntryCard).join('') + '</div>';
    }
    return (
      '<div class="field"><input type="text" id="search-box" placeholder="タイトル・著者・メモを検索" value="' + esc(searchQuery) + '"></div>' +
      '<div class="filter-row">' + filterChips + '</div>' + listHtml
    );
  }

  function renderPickCard() {
    var pool = allPointsFlat();
    if (!pool.length) return '';
    var seed = hashStr(todayStr()) + pickOffset;
    var pick = pool[seed % pool.length];
    var g = genreOf(pick.genre);
    var isRevealed = pickRevealed;
    return (
      '<div class="pick-card">' +
        '<p class="pick-label">今日の1つ</p>' +
        '<button type="button" class="pick-phrase" data-action="toggle-pick">' +
          '<span class="chev">' + (isRevealed ? '⌄' : '›') + '</span><span>' + esc(pick.phrase) + '</span>' +
        '</button>' +
        (isRevealed ? '<p class="pick-detail">' + esc(pick.detail || '（解説は書かれていません）') + '</p>' : '') +
        '<p class="pick-source"><span class="genre-badge genre-' + g.id + '">' + esc(g.label) + '</span>　' + esc(pick.title) + '</p>' +
        '<button type="button" class="btn-shuffle" data-action="shuffle-pick">別の気づきを見る</button>' +
      '</div>'
    );
  }

  function renderReviewTab() {
    var byGenre = {};
    GENRES.forEach(function (g) { byGenre[g.id] = []; });
    allPointsFlat().forEach(function (p) {
      byGenre[p.genre].push(p);
    });
    var totalCount = GENRES.reduce(function (sum, g) { return sum + byGenre[g.id].length; }, 0);
    if (totalCount === 0) {
      return '<div class="empty-state"><strong>まだ気づきがありません</strong><p>本棚でメモを書くと、ここにジャンルごとにまとまって表示されます。</p></div>';
    }
    return renderPickCard() + GENRES.map(function (g) {
      var items = byGenre[g.id];
      if (!items.length) return '';
      var lis = items.map(function (it) {
        var isRevealed = !!revealedPoints[it.id];
        return '<li>' +
          '<button type="button" class="review-phrase" data-action="toggle-point" data-point-id="' + it.id + '">' +
            '<span class="chev">' + (isRevealed ? '⌄' : '›') + '</span><span>' + esc(it.phrase) + '</span>' +
          '</button>' +
          '<span class="review-source">' + esc(it.title) + '</span>' +
          (isRevealed ? '<p class="review-detail">' + esc(it.detail || '（解説は書かれていません）') + '</p>' : '') +
        '</li>';
      }).join('');
      return '<section class="review-section">' +
        '<h2 class="review-heading"><span class="genre-badge genre-' + g.id + '">' + esc(g.label) + '</span></h2>' +
        '<ul class="review-list">' + lis + '</ul>' +
      '</section>';
    }).join('');
  }

  function renderSettingsTab() {
    return (
      '<div class="card">' +
        '<label>バックアップ</label>' +
        '<p class="settings-desc">記録をJSONファイルに書き出します。機種変更の前や、定期的な保存におすすめです。</p>' +
        '<button type="button" class="btn-primary" data-action="export-backup">JSONファイルに書き出す</button>' +
      '</div>' +
      '<div class="card" style="margin-top:16px;">' +
        '<label for="import-file">復元</label>' +
        '<p class="settings-desc">書き出したJSONファイルを選ぶと、まだ無い記録だけ追加されます（既存の記録は上書きされません）。</p>' +
        '<input type="file" id="import-file" accept="application/json">' +
        '<p class="copy-status" id="import-status" aria-live="polite"></p>' +
      '</div>'
    );
  }

  function render() {
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="header"><h1>気づきノート</h1><p>聴いた本・動画の学びをジャンル別に</p></div>' +
      '<div class="tabs" role="tablist">' +
        '<button type="button" class="tab-btn' + (activeTab === 'add' ? ' is-active' : '') + '" data-action="tab" data-tab="add">追加</button>' +
        '<button type="button" class="tab-btn' + (activeTab === 'browse' ? ' is-active' : '') + '" data-action="tab" data-tab="browse">本棚</button>' +
        '<button type="button" class="tab-btn' + (activeTab === 'review' ? ' is-active' : '') + '" data-action="tab" data-tab="review">ふりかえり</button>' +
        '<button type="button" class="tab-btn' + (activeTab === 'settings' ? ' is-active' : '') + '" data-action="tab" data-tab="settings">設定</button>' +
      '</div>' +
      (activeTab === 'add' ? renderAddTab()
        : activeTab === 'browse' ? renderBrowseTab()
        : activeTab === 'review' ? renderReviewTab()
        : renderSettingsTab());
  }

  function init() {
    var app = document.getElementById('app');
    app.addEventListener('click', function (e) {
      var el = e.target.closest('[data-action]');
      if (!el) return;
      var action = el.dataset.action;
      if (action === 'tab') setTab(el.dataset.tab);
      else if (action === 'add-genre') {
        document.querySelectorAll('#add-genres .chip').forEach(function (c) { c.classList.toggle('is-selected', c === el); });
      }
      else if (action === 'submit-add') handleAdd();
      else if (action === 'filter') setFilter(el.dataset.genre);
      else if (action === 'toggle') toggleExpand(el.dataset.id);
      else if (action === 'edit-genre') {
        var id = el.dataset.id;
        if (!drafts[id]) drafts[id] = {};
        drafts[id].genre = el.dataset.genre;
        el.parentElement.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('is-selected', c === el); });
      }
      else if (action === 'save') handleSaveEntry(el.dataset.id);
      else if (action === 'copy-research') copyResearchPrompt(el.dataset.id);
      else if (action === 'shuffle-pick') { pickOffset++; pickRevealed = false; render(); }
      else if (action === 'export-backup') exportBackup();
      else if (action === 'toggle-pick') { pickRevealed = !pickRevealed; render(); }
      else if (action === 'toggle-point') {
        var pid = el.dataset.pointId;
        revealedPoints[pid] = !revealedPoints[pid];
        render();
      }
      else if (action === 'add-point') {
        var eid = el.dataset.id;
        if (!drafts[eid]) drafts[eid] = {};
        if (!drafts[eid].points) drafts[eid].points = [];
        drafts[eid].points.push({ id: genId(), phrase: '', detail: '' });
        render();
        var rows = document.querySelectorAll('[data-id="' + eid + '"].point-phrase');
        if (rows.length) rows[rows.length - 1].focus();
      }
      else if (action === 'toggle-details') {
        var did = el.dataset.id;
        detailsExpanded[did] = !detailsExpanded[did];
        render();
      }
      else if (action === 'remove-point') {
        if (!confirm('このポイントを削除しますか？')) return;
        var eid2 = el.dataset.id;
        var pid2 = el.dataset.pointId;
        if (drafts[eid2] && drafts[eid2].points) {
          drafts[eid2].points = drafts[eid2].points.filter(function (p) { return p.id !== pid2; });
          render();
        }
      }
    });
    var holdStartX = 0, holdStartY = 0;
    app.addEventListener('pointerdown', function (e) {
      var head = e.target.closest('.entry-head');
      if (!head) return;
      holdStartX = e.clientX; holdStartY = e.clientY;
      head.classList.add('is-holding');
      clearTimeout(holdTimer);
      var holdId = head.dataset.id;
      holdTimer = setTimeout(function () {
        head.classList.remove('is-holding');
        handleDelete(holdId);
      }, 800);
    });
    app.addEventListener('pointermove', function (e) {
      if (!holdTimer) return;
      if (Math.abs(e.clientX - holdStartX) > 10 || Math.abs(e.clientY - holdStartY) > 10) {
        cancelHold();
      }
    });
    var cancelHold = function () {
      clearTimeout(holdTimer);
      holdTimer = null;
      document.querySelectorAll('.entry-head.is-holding').forEach(function (b) { b.classList.remove('is-holding'); });
    };
    window.addEventListener('pointerup', cancelHold);
    window.addEventListener('pointercancel', cancelHold);
    app.addEventListener('input', function (e) {
      if (e.target.id === 'search-box') {
        searchQuery = e.target.value;
        var cursorPos = e.target.selectionStart;
        render();
        var newInput = document.getElementById('search-box');
        if (newInput) {
          newInput.focus();
          newInput.setSelectionRange(cursorPos, cursorPos);
        }
        return;
      }
      var field = e.target.dataset.field;
      var id = e.target.dataset.id;
      var pointId = e.target.dataset.pointId;
      if (pointId && id) {
        if (!drafts[id]) drafts[id] = {};
        if (!drafts[id].points) drafts[id].points = [];
        var pt = drafts[id].points.find(function (p) { return p.id === pointId; });
        if (pt) pt[field] = e.target.value;
        return;
      }
      if (!field || !id) return;
      if (!drafts[id]) drafts[id] = {};
      drafts[id][field] = e.target.value;
    });
    app.addEventListener('change', function (e) {
      if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) {
        handleImportFile(e.target.files[0]);
      }
    });
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
